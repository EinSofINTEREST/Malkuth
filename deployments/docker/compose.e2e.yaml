# E2E 스택 — 전체 경로를 실제 컨테이너로 검증한다.
#
# 모델은 결정적 fake provider 를 쓴다 (06 Testing 3): 실 LLM 은 비결정적이고
# 비용이 들며, CI 에서 API key 부재로 실패해야 정상이다.
name: malkuth-e2e

x-agent-defaults: &agent-defaults
  read_only: true
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:size=64m
    - /workspace:size=64m
  networks: [malkuth-e2e-net]
  depends_on:
    fake-provider:
      condition: service_healthy

services:
  fake-provider:
    image: malkuth/fake-provider:${IMAGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deployments/docker/fake-provider.Dockerfile
    networks: [malkuth-e2e-net]
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    # read_only rootfs 에서도 파이썬이 임시 파일을 쓸 수 있어야 한다
    tmpfs:
      - /tmp:size=16m

  agent-echo:
    <<: *agent-defaults
    image: malkuth/agent-echo:${IMAGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deployments/docker/agent-echo.Dockerfile
      args:
        BASE_TAG: ${IMAGE_TAG:-0.1.0}
    ports:
      - "18081:8080"
    environment:
      # E2E 는 모델 비결정성을 배제한다 — echo 대역으로 프로토콜 경로만 검증
      MALKUTH_EXECUTOR: echo
      # 인증을 켠 채 검증한다 — 무인증 E2E 는 인증 회귀를 통과시킨다
      MALKUTH_AGENT_TOKEN: ${MALKUTH_AGENT_TOKEN:-e2e-token}

  # 레퍼런스 그래프의 세 노드. **표준 실행기**로 돈다 — promptset 을 렌더하고
  # 모델을 호출하며 출력을 정형한다. echo 로 두면 그 경로가 전혀 검증되지
  # 않는다 (#153). 모델은 fake-provider 가 받아 실 LLM 을 부르지 않는다
  agent-planner:
    <<: *agent-defaults
    image: malkuth/agent-planner:${IMAGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deployments/docker/agent-reference.Dockerfile
      args:
        BASE_TAG: ${IMAGE_TAG:-0.1.0}
        AGENT: planner
    ports:
      - "18082:8080"
      - "19102:19102"
    # 앵커 뒤에 두어 포트만 덮어쓴다
    environment: &reference-env
      MALKUTH_A2A_PORT: "19102"
      # peer 는 **컨테이너 네트워크에서** 이 이름으로 닿는다
      MALKUTH_A2A_ADVERTISED_HOST: agent-planner
      MALKUTH_AGENT_TOKEN: ${MALKUTH_AGENT_TOKEN:-e2e-token}
      # SDK 가 이 값을 읽는다 — 코드 변경 없이 대역으로 향한다
      ANTHROPIC_BASE_URL: http://fake-provider:8000
      ANTHROPIC_API_KEY: e2e-fake-key
      # graphs/research-pipeline.yaml 의 connections 선언이 원본이다.
      # runtime 이 배포 시 주입하는 것을 여기서는 compose 가 대신한다
      MALKUTH_A2A_EDGES: researcher>planner
      MALKUTH_A2A_SECRET: ${MALKUTH_A2A_SECRET:-e2e-a2a-secret}

  agent-researcher:
    <<: *agent-defaults
    image: malkuth/agent-researcher:${IMAGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deployments/docker/agent-reference.Dockerfile
      args:
        BASE_TAG: ${IMAGE_TAG:-0.1.0}
        AGENT: researcher
    ports:
      - "18083:8080"
      - "19103:19103"
    environment:
      <<: *reference-env
      MALKUTH_A2A_PORT: "19103"
      # peer 는 **컨테이너 네트워크에서** 이 이름으로 닿는다
      MALKUTH_A2A_ADVERTISED_HOST: agent-researcher

  agent-writer:
    <<: *agent-defaults
    image: malkuth/agent-writer:${IMAGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deployments/docker/agent-reference.Dockerfile
      args:
        BASE_TAG: ${IMAGE_TAG:-0.1.0}
        AGENT: writer
    ports:
      - "18084:8080"
      - "19104:19104"
    environment:
      <<: *reference-env
      MALKUTH_A2A_PORT: "19104"
      # peer 는 **컨테이너 네트워크에서** 이 이름으로 닿는다
      MALKUTH_A2A_ADVERTISED_HOST: agent-writer

networks:
  malkuth-e2e-net:
    name: malkuth-e2e-net
    driver: bridge
